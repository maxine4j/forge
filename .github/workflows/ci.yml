name: CI
on:
    pull_request:
    workflow_call:
        inputs:
            publish-image:
                type: boolean
                default: false
            publish-client:
                type: boolean
                default: false
permissions:
    contents: read
jobs:
    checks:
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: ./.github/actions/setup
            - run: pnpm check
            - run: pnpm build
            - name: Verify standalone worker package
              shell: bash
              run: |
                  pnpm --filter @maxine4j/forge-ollama-client stage
                  package="$PWD/services/ollama-client/dist/package"
                  smoke="$(mktemp -d)"
                  tarball="$(cd "$package" && npm pack --pack-destination "$smoke" --silent)"
                  npm install --prefix "$smoke" "$smoke/$tarball"
                  if "$smoke/node_modules/.bin/forge-ollama-client" > "$smoke/output" 2>&1; then
                      exit 1
                  fi
                  grep -F -- "--worker-id must be a lowercase worker ID" "$smoke/output"
            - run: pnpm test
            - run: pnpm test:integration
            - run: pnpm --filter @forge/forge-web exec playwright install --with-deps chromium
            - run: pnpm test:browser
            - name: Retain browser diagnostics
              if: always()
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: forge-browser
                  path: artifacts/forge*/
                  retention-days: 7
    image:
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: ./.github/actions/setup
            - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
            - name: Build image
              run: >-
                  docker buildx build --platform linux/amd64 -f services/forge/Dockerfile --tag forge:dev
                  --build-arg "BUILD_SHA=$GITHUB_SHA"
                  --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY"
                  --load .
            - run: pnpm test:image
            - name: Retain runtime diagnostics
              if: always()
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: forge-runtime
                  path: artifacts/forge/
                  retention-days: 7
    relay-image:
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: ./.github/actions/setup
            - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
            - run: docker buildx build --platform linux/amd64 -f services/ollama-relay/Dockerfile -t forge-ollama-relay:dev --load .
            - run: pnpm test:relay-image
    publish-forge:
        if: inputs.publish-image && github.event_name == 'push'
        runs-on: ubuntu-24.04
        permissions:
            contents: read
            packages: write
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
            - name: Log in to GHCR
              env:
                  GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
            - name: Publish Forge image
              shell: bash
              run: |
                  image="ghcr.io/${GITHUB_REPOSITORY,,}"
                  tags=(--tag "$image:$GITHUB_SHA")
                  if [[ "$GITHUB_REF_TYPE" == tag ]]; then
                      if [[ ! "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
                          echo "Release tags must use vX.X.X with no leading zeroes."
                          exit 1
                      fi
                      tags+=(--tag "$image:$GITHUB_REF_NAME")
                  else
                      tags+=(--tag "$image:latest")
                  fi
                  docker buildx build --platform linux/amd64 -f services/forge/Dockerfile "${tags[@]}" \
                      --build-arg "BUILD_SHA=$GITHUB_SHA" \
                      --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
                      --push .
    publish-relay:
        if: inputs.publish-image && github.event_name == 'push'
        runs-on: ubuntu-24.04
        permissions:
            contents: read
            packages: write
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
            - name: Log in to GHCR
              env:
                  GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
            - name: Publish Ollama relay image
              shell: bash
              run: |
                  image="ghcr.io/${GITHUB_REPOSITORY,,}-ollama-relay"
                  tags=(--tag "$image:$GITHUB_SHA")
                  if [[ "$GITHUB_REF_TYPE" == tag ]]; then
                      if [[ ! "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
                          echo "Release tags must use vX.X.X with no leading zeroes."
                          exit 1
                      fi
                      tags+=(--tag "$image:$GITHUB_REF_NAME")
                  else
                      tags+=(--tag "$image:latest")
                  fi
                  docker buildx build --platform linux/amd64 -f services/ollama-relay/Dockerfile "${tags[@]}" \
                      --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
                      --push .
    publish-client:
        if: inputs.publish-client && github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref_type == 'tag')
        runs-on: ubuntu-24.04
        permissions:
            contents: read
            packages: write
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: ./.github/actions/setup
            - run: pnpm --filter @maxine4j/forge-ollama-client... build
            - name: Stage worker package
              shell: bash
              run: |
                  if [[ "$GITHUB_REF_TYPE" == tag ]]; then
                      version="${GITHUB_REF_NAME#v}"
                  else
                      version="0.0.0-commit${GITHUB_SHA:0:7}"
                  fi
                  pnpm --filter @maxine4j/forge-ollama-client stage "$version"
            - name: Publish worker to GitHub Packages
              working-directory: services/ollama-client/dist/package
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  printf '%s\n' '//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}' > .npmrc
                  npm publish
